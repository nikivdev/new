version = 1

[[tasks]]
name = "setup"
command = "bun install"
description = "Install tools and dependencies"
shortcuts = ["s"]
dependencies = ["bun"]

[[tasks]]
name = "dev"
command = "bun run dev"
description = "Run development server"
dependencies = ["setup"]
shortcuts = ["d"]

[deps]
bun = ["bun"]

[cloudflare]
deploy = "bun run build && bunx wrangler pages deploy out --project-name ${FLOW_DOCS_PROJECT:-myflow}"
env_apply = "never"
url = "https://myflow.sh"
